# Copy to .github/workflows/evals.yml in your repository.
# Requires the repository secret TRACCIA_API_KEY.
name: Evals

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write # lets the action post the result comment

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: evals-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci # @traccia/sdk is in package.json

      - uses: traccia-ai/traccia-eval-action@v1
        with:
          # npx --no-install uses the version in your lockfile.
          command: >-
            npx --no-install traccia-ts eval evals/support_agent.mjs
            --dataset support-golden
            --scorer exact_match
            --min-pass-rate 0.9
            --output summary.json
        env:
          TRACCIA_API_KEY: ${{ secrets.TRACCIA_API_KEY }}
